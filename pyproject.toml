[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vishc-ppd"
version = "1.0.0"
description = "Reference code for the VISHC-PPD plantar-pressure 8-region segmentation benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VISHC-PPD authors"}]
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=9.0",
  "shapely>=2.0", "albumentations>=2.0", "transformers>=4.40", "timm>=1.0", "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["vishc_ppd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
